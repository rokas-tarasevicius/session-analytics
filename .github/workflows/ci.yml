name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run on Linux only to save macOS minutes (billed at 10x on private repositories).
        # macOS runs on pushes to master, manual runs, and pull requests labelled `macos`.
        os: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'macos')) && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and test
        run: npm run check
