name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only the private preview may treat hosted macOS as advisory. Public releases require both platforms.
    continue-on-error: ${{ github.event.repository.private && matrix.os == 'macos-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Contributor code never runs on the persistent private runner. Disconnect that runner before going public.
        # Private PRs use hosted Linux even if private hosted minutes are unavailable; do not fall back to agentbox.
        os: ${{ !github.event.repository.private && fromJSON('["ubuntu-latest","macos-latest"]') || github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["agentbox","macos-latest"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check source release readiness
        run: npm run release:check

  browser:
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' }}
    runs-on: ${{ github.event.repository.private && 'macos-latest' || 'ubuntu-latest' }}
    continue-on-error: ${{ github.event.repository.private }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test dashboard in Chrome
        run: npm run test:browser
        env:
          SESSION_ANALYTICS_CHROME: ${{ github.event.repository.private && '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || '/usr/bin/google-chrome' }}
          SESSION_ANALYTICS_REQUIRE_BROWSER: '1'
