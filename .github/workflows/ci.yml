name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run on Linux only while the repository is private (macOS minutes bill at 10x and
        # exhausted the spending limit on 2026-10-12). macOS runs on pushes to master and manual runs.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["agentbox"]') || fromJSON('["agentbox","macos-latest"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and test
        run: npm run check

      - name: Check snapshot schemas
        run: node scripts/snapshot-schema.ts --check

      - name: Smoke test synthetic JSON report
        run: node scripts/demo.ts report --json | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'

      - name: Check package contents
        run: npm pack --dry-run

  browser:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test dashboard in Chrome
        run: node --test test/dashboard.browser.test.ts
