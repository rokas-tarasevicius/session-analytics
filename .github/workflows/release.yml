name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Self-hosted Linux runner, like the check job: GitHub-hosted jobs cannot start until the spending limit is restored.
    runs-on: agentbox
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and test
        run: npm run check

      - name: Extract release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const heading = `## [${tag.slice(1)}]`;
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex((line) => line === heading || line.startsWith(`${heading} - `));
          if (start === -1) {
            console.error(`No CHANGELOG.md section found for ${tag} (${heading}).`);
            process.exit(1);
          }
          const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          writeFileSync('notes.md', lines.slice(start + 1, end === -1 ? undefined : end).join('\n').trim() + '\n');
          NODE

      - name: Create GitHub Release
        # REST call with the workflow token: no gh CLI dependency on the runner. Re-running for an existing tag updates nothing and fails loudly.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const body = { tag_name: tag, name: tag, body: readFileSync('notes.md', 'utf8'), draft: false, prerelease: false };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases`, {
            method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!response.ok) { console.error(`Release creation failed: HTTP ${response.status}`); console.error(await response.text()); process.exit(1); }
          console.log(`Created release ${tag}`);
          NODE
        env:
          GH_TOKEN: ${{ github.token }}
