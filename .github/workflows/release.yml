name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: release validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag and release notes
        run: node scripts/release-check.ts --notes "$GITHUB_REF_NAME"

      - name: Check source release readiness
        run: npm run release:check

  browser:
    name: release browser (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test dashboard in Chrome
        run: npm run test:browser
        env:
          SESSION_ANALYTICS_CHROME: /usr/bin/google-chrome
          SESSION_ANALYTICS_REQUIRE_BROWSER: '1'

  package:
    name: release package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag and release notes
        run: node scripts/release-check.ts --notes "$GITHUB_REF_NAME"

      - name: Build and pack
        # One tarball for every channel: the GitHub Release, npm and Homebrew all receive these bytes.
        run: |
          npm run pack:release
          cp "release/session-analytics-${GITHUB_REF_NAME#v}.tgz" release/session-analytics.tgz
          cd release && sha256sum "session-analytics-${GITHUB_REF_NAME#v}.tgz" session-analytics.tgz > SHA256SUMS && cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            notes.md
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: installed smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Node.js that engines allows, the newest 24.x, and the Node.js that Homebrew's formula uses.
        node: ['24.0.0', '24', '26']
    timeout-minutes: 15
    steps:
      - name: Check out
        # The smoke script and demo fixtures only; the code under test is the packed tarball.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Verify checksums
        working-directory: release
        run: if [ "$RUNNER_OS" = macOS ]; then shasum -a 256 -c SHA256SUMS; else sha256sum -c SHA256SUMS; fi

      - name: Install and run the tarball
        run: node scripts/smoke-installed.ts "release/session-analytics-${GITHUB_REF_NAME#v}.tgz"

  release:
    name: publish release
    needs: [validate, browser, package, smoke]
    # No tag can bypass platform, browser or installed-package checks, including skipped or cancelled jobs.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.browser.result == 'success' && needs.package.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/session-analytics-*.tgz

      - name: Publish GitHub Release
        # REST calls with the workflow token: no gh CLI dependency on the runner. Files go to a draft first, so
        # /releases/latest/download/session-analytics.tgz never 404s; a re-run resumes this tag's draft, and a published release is never changed.
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME, version = tag.slice(1), prerelease = version.includes('-');
          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases`;
          const call = async (url, init = {}) => {
            const response = await fetch(url, { ...init, headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', ...init.headers } });
            if (!response.ok) { console.error(`${init.method ?? 'GET'} ${new URL(url).pathname} failed: HTTP ${response.status}`); console.error(await response.text()); process.exit(1); }
            return response.status === 204 ? null : response.json();
          };
          const files = [`session-analytics-${version}.tgz`, 'session-analytics.tgz', 'SHA256SUMS'].map((name) => {
            const bytes = readFileSync(`release/${name}`);
            return { name, bytes, digest: `sha256:${createHash('sha256').update(bytes).digest('hex')}` };
          });
          let release = null;
          for (let page = 1; !release; page++) {
            const releases = await call(`${api}?per_page=100&page=${page}`);
            if (!releases.length) break;
            release = releases.find((candidate) => candidate.tag_name === tag) ?? null;
          }
          if (release && !release.draft) {
            if (files.every((file) => release.assets.some((asset) => asset.name === file.name && asset.digest === file.digest))) { console.log(`Release ${tag} is already published with these files.`); process.exit(0); }
            console.error(`Release ${tag} is already published with other files; published releases are never changed.`); process.exit(1);
          }
          const fields = { tag_name: tag, name: tag, body: readFileSync('notes.md', 'utf8'), prerelease };
          release = release ? await call(`${api}/${release.id}`, { method: 'PATCH', body: JSON.stringify(fields) }) : await call(api, { method: 'POST', body: JSON.stringify({ ...fields, draft: true }) });
          for (const file of files) {
            for (const asset of release.assets.filter((asset) => asset.name === file.name)) await call(`${api}/assets/${asset.id}`, { method: 'DELETE' });
            const uploaded = await call(`${release.upload_url.replace(/\{.*\}$/, '')}?name=${encodeURIComponent(file.name)}`, {
              method: 'POST', body: file.bytes, headers: { 'Content-Type': file.name.endsWith('.tgz') ? 'application/gzip' : 'text/plain' },
            });
            if (uploaded.size !== file.bytes.length || (uploaded.digest && uploaded.digest !== file.digest)) { console.error(`Uploaded ${file.name} does not match the verified file.`); process.exit(1); }
          }
          await call(`${api}/${release.id}`, { method: 'PATCH', body: JSON.stringify({ draft: false, make_latest: prerelease ? 'false' : 'true' }) });
          console.log(`Published release ${tag} with ${files.map((file) => file.name).join(', ')}`);
          NODE
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    name: publish npm
    needs: [release]
    # Off until the one-time npm bootstrap in docs/release.md sets the NPM_PUBLISH repository variable.
    if: ${{ !cancelled() && needs.release.result == 'success' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Check out
        # The smoke script and demo fixtures only; the published bytes are the release tarball.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm
        # Trusted publishing needs npm 11.5.1 or newer; pinned so the publishing client never changes unreviewed.
        run: npm install --global npm@11.21.0

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Publish the release tarball
        # Trusted publishing exchanges this job's OIDC token for a one-time credential and adds provenance; no npm token is stored.
        # A re-run after a successful publish finds the same bytes and publishes nothing.
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "release/session-analytics-$V.tgz" | openssl base64 -A)"
          if [ "$(npm view "session-analytics@$V" dist.integrity 2>/dev/null)" = "$INTEGRITY" ]; then echo "session-analytics@$V is already on npm with these bytes."; exit 0; fi
          npm publish "release/session-analytics-$V.tgz" --tag "$DIST_TAG"

      - name: Verify npm serves the release bytes
        run: |
          V="${GITHUB_REF_NAME#v}"
          EXPECTED="sha512-$(openssl dgst -sha512 -binary "release/session-analytics-$V.tgz" | openssl base64 -A)"
          for _ in $(seq 30); do
            ACTUAL="$(npm view "session-analytics@$V" dist.integrity 2>/dev/null || true)"
            if [ "$ACTUAL" = "$EXPECTED" ]; then echo "npm serves session-analytics@$V as $EXPECTED"; exit 0; fi
            if [ -n "$ACTUAL" ]; then break; fi
            sleep 10
          done
          echo "npm reports ${ACTUAL:-no version} for session-analytics@$V; the release tarball is $EXPECTED" >&2
          exit 1

      - name: Install from npm and run it
        run: node scripts/smoke-installed.ts "session-analytics@${GITHUB_REF_NAME#v}"

  homebrew:
    name: update Homebrew tap
    needs: [release, npm]
    # Off until the tap and its token exist (docs/release.md) and the HOMEBREW_TAP repository variable is set.
    # Waits for npm only when npm publishing ran; prereleases leave the tap alone.
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && vars.HOMEBREW_TAP == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: homebrew
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Render the formula
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/homebrew-formula.ts --version "$V" --sha256 "$(sha256sum "release/session-analytics-$V.tgz" | cut -d ' ' -f 1)" > session-analytics.rb
          cat session-analytics.rb

      - name: Commit the formula to the tap
        # Contents API with a token limited to the tap: one commit to main, or none when the formula is unchanged.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const url = 'https://api.github.com/repos/rokas-tarasevicius/homebrew-tap/contents/Formula/session-analytics.rb';
          const headers = { Authorization: `Bearer ${process.env.TAP_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const formula = readFileSync('session-analytics.rb', 'utf8');
          const current = await fetch(`${url}?ref=main`, { headers });
          if (!current.ok && current.status !== 404) { console.error(`Reading the tap failed: HTTP ${current.status}`); console.error(await current.text()); process.exit(1); }
          const existing = current.ok ? await current.json() : null;
          if (existing && Buffer.from(existing.content, 'base64').toString('utf8') === formula) { console.log('The tap already has this formula.'); process.exit(0); }
          const response = await fetch(url, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({
            message: `session-analytics ${process.env.GITHUB_REF_NAME.slice(1)}`, content: Buffer.from(formula).toString('base64'), branch: 'main', ...(existing ? { sha: existing.sha } : {}),
          }) });
          if (!response.ok) { console.error(`Updating the tap failed: HTTP ${response.status}`); console.error(await response.text()); process.exit(1); }
          console.log(`Updated Formula/session-analytics.rb in rokas-tarasevicius/homebrew-tap to ${process.env.GITHUB_REF_NAME}`);
          NODE
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
