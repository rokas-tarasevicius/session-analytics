name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and test
        run: npm run check

      - name: Extract release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const heading = `## [${tag.slice(1)}]`;
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex((line) => line === heading || line.startsWith(`${heading} - `));
          if (start === -1) {
            console.error(`No CHANGELOG.md section found for ${tag} (${heading}).`);
            process.exit(1);
          }
          const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          writeFileSync('notes.md', lines.slice(start + 1, end === -1 ? undefined : end).join('\n').trim() + '\n');
          NODE

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
