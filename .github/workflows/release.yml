name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: release validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag and release notes
        run: node scripts/release-check.ts --notes "$GITHUB_REF_NAME"

      - name: Check source release readiness
        run: npm run release:check

  browser:
    name: release browser (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test dashboard in Chrome
        run: npm run test:browser
        env:
          SESSION_ANALYTICS_CHROME: /usr/bin/google-chrome
          SESSION_ANALYTICS_REQUIRE_BROWSER: '1'

  release:
    name: publish release
    needs: [validate, browser]
    # No tag can bypass platform or browser checks, including skipped or cancelled jobs.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Extract release notes
        run: node scripts/release-check.ts --notes "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        # REST call with the workflow token: no gh CLI dependency on the runner. Re-running for an existing tag updates nothing and fails loudly.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const body = { tag_name: tag, name: tag, body: readFileSync('notes.md', 'utf8'), draft: false, prerelease: false };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases`, {
            method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!response.ok) { console.error(`Release creation failed: HTTP ${response.status}`); console.error(await response.text()); process.exit(1); }
          console.log(`Created release ${tag}`);
          NODE
        env:
          GH_TOKEN: ${{ github.token }}
