"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"

[scripts.run.dashboard]
available_in = [ "local" ]
command = "node bin/session-analytics.ts"
default = true
icon = "activity"

[scripts.run.demo]
available_in = [ "local" ]
command = "npm run demo"
icon = "play"
